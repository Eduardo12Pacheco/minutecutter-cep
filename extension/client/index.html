<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="index.css">
</head>
<body>
	<div class="topbar">
		<span class="title">Minute Cutter</span>
	</div>
	<div class="clipbox">
		<span id="clipInfo" class="clipinfo">Sin clip seleccionado</span>
	</div>

	<div class="tableWrap">
		<table id="rangeTable">
			<thead>
				<tr>
					<th class="col-num">N°</th>
					<th class="col-min">Minuto</th>
					<th class="col-del"></th>
				</tr>
			</thead>
			<tbody id="tbody"></tbody>
		</table>
	</div>

	<div class="hint">Formato: minutos:segundos — ej. 1:20 o 1:20:30</div>

	<div class="actions">
		<button id="addRow" class="btn ghost">+ Agregar fila</button>
		<button id="cutBtn" class="btn primary">Cortar</button>
	</div>
	<div id="status" class="status"></div>

	<div class="shotsBox">
		<div class="shotsTitle">Tomas especiales</div>
		<div class="shotsHint">Seleccioná un clip de video en el timeline para cortar en cada cambio de toma. No elimina material.</div>
		<div class="shotsRow">
			<select id="shotsSensitivity" class="shotsSelect">
				<option value="LowSensitivity">Baja</option>
				<option value="MediumSensitivity" selected>Media</option>
				<option value="HighSensitivity">Alta</option>
			</select>
			<button id="shotsBtn" class="btn primary">Detectar cambios de toma</button>
		</div>
	</div>

	<script src="index.js"></script>
</body>
</html>
