<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de corte de MinuteCutter</title>
  <desc id="desc">Clip fuente, rango en tiempo de fuente, pedazos conservados y escala 140%</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7a90"/>
    </marker>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d5aa0"/>
      <stop offset="1" stop-color="#4a7bd0"/>
    </linearGradient>
    <linearGradient id="keep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e9e5b"/>
      <stop offset="1" stop-color="#57c27d"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c23b3b"/>
      <stop offset="1" stop-color="#e06060"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b26a14"/>
      <stop offset="1" stop-color="#e09a3c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="420" rx="18" fill="#10141c"/>

  <text x="450" y="44" text-anchor="middle" fill="#e8eef7" font-size="20" font-weight="700">Corte por rangos — flujo del panel</text>

  <!-- Paso 1: clip fuente -->
  <g>
    <rect x="40" y="100" width="180" height="120" rx="12" fill="url(#film)"/>
    <rect x="52" y="112" width="156" height="44" rx="4" fill="#0d1830" opacity="0.55"/>
    <text x="130" y="124" text-anchor="middle" fill="#cfe0ff" font-size="9">PUNTO DE REPRODUCCIÓN</text>
    <text x="130" y="136" text-anchor="middle" fill="#4d6fc9" font-size="7">0:00</text>
    <rect x="52" y="158" width="156" height="14" rx="3" fill="#0d1830" opacity="0.4"/>
    <text x="130" y="183" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Clip fuente</text>
    <text x="130" y="201" text-anchor="middle" fill="#cfe0ff" font-size="10">material 0:00 – 1:00</text>
  </g>

  <line x1="228" y1="160" x2="276" y2="160" stroke="#6b7a90" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Paso 2: rangos mm:ss -->
  <g>
    <rect x="284" y="100" width="200" height="120" rx="12" fill="#1c2534"/>
    <text x="384" y="122" text-anchor="middle" fill="#e8eef7" font-size="13" font-weight="600">Rangos a conservar</text>
    <rect x="298" y="136" width="86" height="26" rx="6" fill="#26314a"/>
    <rect x="390" y="136" width="82" height="26" rx="6" fill="#26314a"/>
    <text x="341" y="153" text-anchor="middle" fill="#8fd6ac" font-size="12">0:10</text>
    <text x="431" y="153" text-anchor="middle" fill="#8fd6ac" font-size="12">0:20</text>
    <rect x="298" y="168" width="86" height="26" rx="6" fill="#26314a"/>
    <rect x="390" y="168" width="82" height="26" rx="6" fill="#26314a"/>
    <text x="341" y="185" text-anchor="middle" fill="#8fd6ac" font-size="12">0:40</text>
    <text x="431" y="185" text-anchor="middle" fill="#8fd6ac" font-size="12">0:55</text>
    <text x="384" y="212" text-anchor="middle" fill="#8b98ad" font-size="9">mm:ss · tiempos de FUENTE</text>
  </g>

  <line x1="492" y1="160" x2="540" y2="160" stroke="#6b7a90" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Paso 3: pedazos -->
  <g>
    <rect x="548" y="80" width="312" height="170" rx="12" fill="#1c2534"/>
    <text x="704" y="102" text-anchor="middle" fill="#e8eef7" font-size="13" font-weight="600">Pedazos conservados</text>
    <rect x="562" y="116" width="140" height="30" rx="6" fill="url(#keep)"/>
    <text x="632" y="136" text-anchor="middle" fill="#ffffff" font-size="11">0:10–0:20</text>
    <rect x="562" y="152" width="140" height="30" rx="6" fill="url(#keep)"/>
    <text x="632" y="172" text-anchor="middle" fill="#ffffff" font-size="11">0:40–0:55</text>
    <rect x="562" y="188" width="120" height="30" rx="6" fill="url(#drop)"/>
    <text x="622" y="208" text-anchor="middle" fill="#ffe0e0" font-size="10" font-weight="600">descarta lo demás</text>
    <text x="704" y="238" text-anchor="middle" fill="#8b98ad" font-size="9">insertados contiguos en la posición original</text>
  </g>

  <line x1="704" y1="258" x2="704" y2="296" stroke="#6b7a90" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Paso 4: escala 140 -->
  <g>
    <rect x="548" y="304" width="312" height="76" rx="12" fill="url(#scale)"/>
    <text x="704" y="336" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Escala automática 140 %</text>
    <text x="704" y="358" text-anchor="middle" fill="#ffe7c4" font-size="10">cada pedazo se ajusta al tamaño del frame</text>
  </g>

  <!-- Nota sin ripple -->
  <g>
    <rect x="40" y="304" width="480" height="76" rx="12" fill="#3a2e1e"/>
    <text x="280" y="332" text-anchor="middle" fill="#f5d6a4" font-size="13" font-weight="600">Modo sin ripple</text>
    <text x="280" y="352" text-anchor="middle" fill="#ecd3ad" font-size="10">los clips posteriores conservan su posición absoluta · puede quedar un hueco</text>
  </g>
</svg>
